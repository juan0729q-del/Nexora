name: Sync Nexora CJ catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: nexora-cj-catalog-sync
  cancel-in-progress: false

jobs:
  import-and-version:
    runs-on: ubuntu-latest
    env:
      NEXORA_CATALOG_IMPORT_URL: ${{ vars.NEXORA_CATALOG_IMPORT_URL }}
      CRON_SECRET: ${{ secrets.NEXORA_CRON_SECRET }}
    steps:
      - name: Check protected endpoint configuration
        id: config
        run: |
          if [ -z "$NEXORA_CATALOG_IMPORT_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Missing NEXORA_CATALOG_IMPORT_URL variable or NEXORA_CRON_SECRET secret; skipping safely."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.configured == 'true'
      - name: Request validated CJ products from Nexora
        if: steps.config.outputs.configured == 'true'
        run: curl --fail-with-body --silent --show-error --retry 2 --retry-delay 10 -H "Authorization: Bearer $CRON_SECRET" -X POST "$NEXORA_CATALOG_IMPORT_URL" -o .catalog-import.json
      - name: Validate and persist catalog JSON
        if: steps.config.outputs.configured == 'true'
        run: node scripts/persist-catalog-import.mjs .catalog-import.json
      - name: Commit catalog update
        if: steps.config.outputs.configured == 'true'
        run: |
          if git diff --quiet -- src/data/catalog.json; then
            echo "Catalog unchanged."
            exit 0
          fi
          git config user.name "nexora-catalog-bot"
          git config user.email "nexora-catalog-bot@users.noreply.github.com"
          git add src/data/catalog.json
          git commit -m "Sync verified CJ catalog"
          git push
