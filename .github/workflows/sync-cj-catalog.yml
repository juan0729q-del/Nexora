name: Sync Nexora CJ catalog

on:
  workflow_dispatch:
    inputs:
      discover:
        description: Consultar además novedades para rotación
        type: boolean
        default: false
  schedule:
    - cron: "0 */6 * * *"
    - cron: "15 6 * * 1"

permissions:
  contents: write
  id-token: write

concurrency:
  group: nexora-cj-catalog-sync
  cancel-in-progress: false

env:
  NEXORA_CATALOG_IMPORT_URL: ${{ vars.NEXORA_CATALOG_IMPORT_URL }}

jobs:
  inventory:
    name: Actualizar inventario publicado
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Consultar inventario con recuperación acotada
        id: read
        run: pnpm exec tsx scripts/request-cj-sync.ts inventory
      - name: Aplicar únicamente cantidades confirmadas
        run: pnpm exec tsx scripts/persist-cj-inventory.ts
      - name: Validar antes de publicar
        run: |
          pnpm catalog:validate
          pnpm test
          pnpm build
      - name: Publicar inventario verificado
        run: |
          git config user.name "nexora-catalog-bot"
          git config user.email "nexora-catalog-bot@users.noreply.github.com"
          git add src/data/catalog.json
          git commit -m "Refresh verified CJ inventory"
          git fetch origin main
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
            git rebase origin/main
            pnpm catalog:validate
            pnpm test
            pnpm build
          fi
          git push origin HEAD:main
      - name: Señalar lecturas que no pudieron recuperarse
        if: steps.read.outputs.complete == 'false'
        run: |
          echo "::error::Se publicaron las lecturas válidas, pero quedaron SKU sin verificar tras tres intentos. No se sustituyeron por cero."
          exit 1
      - name: Conservar evidencia de la sincronización
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cj-inventory-result
          path: .catalog-inventory.json
          include-hidden-files: true
          retention-days: 7

  discovery:
    name: Revisar novedades sin bloquear inventario
    needs: inventory
    if: inputs.discover == true || github.event.schedule == '15 6 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Consultar novedades verificadas
        run: pnpm exec tsx scripts/request-cj-sync.ts discovery
      - name: Separar novedades pendientes de edición
        id: review
        run: pnpm exec tsx scripts/review-catalog-candidates.ts
      - name: Aplicar rotación con contenido revisado
        if: steps.review.outputs.publishable == 'true'
        run: node scripts/persist-catalog-import.mjs .catalog-discovery.json
      - name: Validar antes de publicar
        run: |
          pnpm catalog:validate
          pnpm test
          pnpm build
      - name: Versionar resultado de revisión
        run: |
          if git diff --quiet -- src/data/catalog.json src/data/catalog-candidates.json; then
            echo "Sin cambios pendientes."
            exit 0
          fi
          git config user.name "nexora-catalog-bot"
          git config user.email "nexora-catalog-bot@users.noreply.github.com"
          git add src/data/catalog.json src/data/catalog-candidates.json
          git commit -m "Review verified CJ catalog candidates"
          git fetch origin main
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
            git rebase origin/main
            pnpm catalog:validate
            pnpm test
            pnpm build
          fi
          git push origin HEAD:main
      - name: Conservar candidatos para revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cj-catalog-candidate
          path: .catalog-discovery.json
          include-hidden-files: true
          retention-days: 7
